<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="实时收入">
<meta name="theme-color" content="#fff0f5">
<title>小唯 · 实时收入</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #fff5f8;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px 14px 40px;
  }
  .app { width: 100%; max-width: 460px; }

  .banner {
    border-radius: 22px;
    padding: 18px 16px 16px;
    text-align: center;
    background: linear-gradient(135deg, #ffe3ee 0%, #ffeef6 45%, #f3f0ff 100%);
    box-shadow: 0 6px 18px rgba(255, 158, 191, .22);
    margin-bottom: 16px;
  }
  .banner .pets { font-size: 15px; letter-spacing: 6px; margin-bottom: 4px; }
  .banner h1 { font-size: 21px; color: #e8578f; font-weight: 700; letter-spacing: 1px; }
  .banner p { margin-top: 5px; font-size: 12px; color: #b98099; }

  .card {
    background: #fff;
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 4px 14px rgba(226, 160, 188, .16);
  }
  .card h2 { font-size: 13px; color: #97a0b5; font-weight: 600; margin-bottom: 10px; letter-spacing: .5px; }

  .rates { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .rate-btn {
    border: 2px solid #f3e3ea;
    background: #fffafc;
    border-radius: 16px;
    padding: 14px 8px;
    font-family: inherit;
    cursor: pointer;
    transition: all .15s;
  }
  .rate-btn .r-main { display: block; font-size: 22px; font-weight: 700; color: #5b5f6e; }
  .rate-btn .r-sub { display: block; font-size: 11px; color: #b0b6c4; margin-top: 3px; }
  .rate-btn.on {
    border-color: #ff8fb8;
    background: #ffeef5;
    box-shadow: 0 4px 12px rgba(255, 143, 184, .28);
  }
  .rate-btn.on .r-main { color: #e8578f; }
  .rate-btn.on .r-sub { color: #e79bb8; }

  .time-row { display: flex; align-items: center; gap: 10px; }
  .time-box {
    flex: 1;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 4px;
    background: #fdf5f8;
    border: 1px solid #f5e6ed;
    border-radius: 14px;
    padding: 10px 6px;
  }
  .time-box input {
    width: 54px;
    border: 0;
    background: transparent;
    font-family: inherit;
    font-size: 24px;
    font-weight: 700;
    color: #5b5f6e;
    text-align: right;
    outline: none;
  }
  .time-box span { font-size: 12px; color: #b0b6c4; }
  .step-col { display: flex; flex-direction: column; gap: 6px; }
  .step {
    width: 38px; height: 30px;
    border: 1px solid #f0dfe8; background: #fff; border-radius: 10px;
    font-size: 16px; color: #e8578f; cursor: pointer; line-height: 1;
  }
  .quick { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .quick button {
    flex: 1 1 0;
    min-width: 0;
    border: 1px solid #f5e6ed; background: #fffafc; border-radius: 12px;
    padding: 9px 0; font-size: 12.5px; color: #8b91a3; font-family: inherit; cursor: pointer;
  }
  .quick button:active { background: #ffeef5; color: #e8578f; }

  .result { background: linear-gradient(160deg,#fff 0%,#fff8fb 100%); }
  .line { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 2px; }
  .line + .line { border-top: 1px dashed #f4e7ee; }
  .line .k { font-size: 14px; color: #7d8496; }
  .line .v { font-size: 17px; font-weight: 700; color: #444; font-variant-numeric: tabular-nums; }
  .line .v.red { color: #f0674f; }
  .line.big { padding-top: 14px; }
  .line.big .k { font-size: 15px; color: #6b7280; font-weight: 600; }
  .line.big .v { font-size: 30px; color: #14a44d; letter-spacing: -.5px; }
  .hourly { margin-top: 10px; text-align: center; font-size: 12px; color: #a8aebd; }
  .hourly b { color: #e8578f; }

  .est .line .v { font-size: 15px; color: #5b5f6e; }
  .est .line .k { font-size: 13px; }
  .est-days { display: flex; gap: 8px; margin-bottom: 8px; }
  .est-days button {
    flex: 1; border: 1px solid #f5e6ed; background: #fffafc; border-radius: 12px;
    padding: 8px 0; font-size: 13px; color: #8b91a3; font-family: inherit; cursor: pointer;
  }
  .est-days button.on { border-color: #ff8fb8; background: #ffeef5; color: #e8578f; font-weight: 600; }

  .tip { text-align: center; font-size: 11px; color: #b6bcc9; margin-top: 6px; line-height: 1.7; }
  .paw { text-align: center; font-size: 14px; color: #f0c2d6; letter-spacing: 8px; margin-top: 12px; }
</style>
</head>
<body>
<div class="app">

  <div class="banner">
    <div class="pets">🐹🐱🐰</div>
    <h1>小唯 · 实时收入</h1>
    <p>选时薪 填时长 到手钱自己跳</p>
  </div>

  <div class="card">
    <h2>选时薪（元 / 小时）</h2>
    <div class="rates" id="rates">
      <button class="rate-btn on" data-rate="61"><span class="r-main">61</span><span class="r-sub">到手 44.9 / 小时</span></button>
      <button class="rate-btn" data-rate="49"><span class="r-main">49</span><span class="r-sub">到手 36.1 / 小时</span></button>
      <button class="rate-btn" data-rate="45"><span class="r-main">45</span><span class="r-sub">到手 33.1 / 小时</span></button>
      <button class="rate-btn" data-rate="20"><span class="r-main">20</span><span class="r-sub">到手 14.7 / 小时</span></button>
    </div>
  </div>

  <div class="card">
    <h2>这次打了多久</h2>
    <div class="time-row">
      <div class="time-box">
        <input id="hours" type="number" min="0" max="24" step="1" value="5" inputmode="numeric">
        <span>小时</span>
      </div>
      <div class="step-col">
        <button class="step" data-add="1">+</button>
        <button class="step" data-add="-1">−</button>
      </div>
      <div class="time-box">
        <input id="mins" type="number" min="0" max="59" step="5" value="0" inputmode="numeric">
        <span>分钟</span>
      </div>
      <div class="step-col">
        <button class="step" data-addmin="10">+</button>
        <button class="step" data-addmin="-10">−</button>
      </div>
    </div>
    <div class="quick">
      <button data-set="1">1 小时</button>
      <button data-set="2">2 小时</button>
      <button data-set="3">3 小时</button>
      <button data-set="5">5 小时</button>
      <button data-set="8">8 小时</button>
    </div>
  </div>

  <div class="card result">
    <div class="line">
      <span class="k">毛收入</span>
      <span class="v" id="gross">¥0.00</span>
    </div>
    <div class="line">
      <span class="k">抽成（26.4%）</span>
      <span class="v red" id="ded">-¥0.00</span>
    </div>
    <div class="line big">
      <span class="k">到手</span>
      <span class="v" id="net">¥0.00</span>
    </div>
    <div class="hourly" id="hourlyTip">按 61 元算，整小时计，不足一小时不计钱</div>
  </div>

  <div class="card est">
    <h2>照这个节奏算下去</h2>
    <div class="est-days" id="estDays">
      <button class="on" data-days="1">一天</button>
      <button data-days="6">六天</button>
      <button data-days="24">一个月（24 天）</button>
    </div>
    <div class="line">
      <span class="k">毛收入</span>
      <span class="v" id="estGross">¥0.00</span>
    </div>
    <div class="line">
      <span class="k">到手</span>
      <span class="v" id="estNet">¥0.00</span>
    </div>
  </div>

  <div class="tip">不足一小时的部分不计钱 · 抽成 26.4% · 数据只存在你手机里</div>
  <div class="paw">🐾 🐾 🐾</div>

</div>

<script>
(function () {
  var RATE_DED = 0.264;
  var state = { rate: 61, hours: 5, mins: 0, days: 1 };

  function money(n) {
    return '¥' + n.toFixed(2);
  }

  function calc() {
    var totalHours = state.hours + state.mins / 60;
    var wholeHours = Math.floor(totalHours + 1e-9);
    var gross = state.rate * wholeHours;
    var ded = gross * RATE_DED;
    var net = gross - ded;
    return { wholeHours: wholeHours, gross: gross, ded: ded, net: net };
  }

  function render() {
    var r = calc();

    document.getElementById('gross').textContent = money(r.gross);
    document.getElementById('ded').textContent = '-' + money(r.ded);
    document.getElementById('net').textContent = money(r.net);

    var perHour = state.rate * (1 - RATE_DED);
    var tip = '按 ' + state.rate + ' 元算，整小时计，到手 ' + perHour.toFixed(1) + ' 元 / 小时';
    if (r.wholeHours !== (state.hours + state.mins / 60)) {
      tip += '（多的 ' + (state.hours + state.mins / 60 - r.wholeHours).toFixed(2).replace(/0$/, '') + ' 小时不记钱）';
    }
    document.getElementById('hourlyTip').textContent = tip;

    document.getElementById('estGross').textContent = money(r.gross * state.days);
    document.getElementById('estNet').textContent = money(r.net * state.days);

    var btns = document.querySelectorAll('.rate-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('on', Number(btns[i].getAttribute('data-rate')) === state.rate);
    }
    var dbtns = document.querySelectorAll('#estDays button');
    for (var j = 0; j < dbtns.length; j++) {
      dbtns[j].classList.toggle('on', Number(dbtns[j].getAttribute('data-days')) === state.days);
    }
  }

  document.getElementById('rates').addEventListener('click', function (e) {
    var b = e.target.closest('.rate-btn');
    if (!b) return;
    state.rate = Number(b.getAttribute('data-rate'));
    render();
  });

  document.getElementById('estDays').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    state.days = Number(b.getAttribute('data-days'));
    render();
  });

  var hoursInput = document.getElementById('hours');
  var minsInput = document.getElementById('mins');

  function readInputs() {
    var h = parseInt(hoursInput.value, 10);
    var m = parseInt(minsInput.value, 10);
    state.hours = isNaN(h) ? 0 : Math.max(0, Math.min(24, h));
    state.mins = isNaN(m) ? 0 : Math.max(0, Math.min(59, m));
    render();
  }

  hoursInput.addEventListener('input', readInputs);
  minsInput.addEventListener('input', readInputs);

  document.querySelectorAll('.step').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var d = Number(btn.getAttribute('data-add'));
      state.hours = Math.max(0, Math.min(24, state.hours + d));
      hoursInput.value = state.hours;
      render();
    });
  });

  document.querySelectorAll('.step-col .step[data-addmin]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var d = Number(btn.getAttribute('data-addmin'));
      var total = state.hours * 60 + state.mins + d;
      total = Math.max(0, Math.min(24 * 60 + 59, total));
      state.hours = Math.floor(total / 60);
      state.mins = total % 60;
      hoursInput.value = state.hours;
      minsInput.value = state.mins;
      render();
    });
  });

  document.querySelectorAll('.quick button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      state.hours = Number(btn.getAttribute('data-set'));
      state.mins = 0;
      hoursInput.value = state.hours;
      minsInput.value = 0;
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
